# 로컬 개발/시연용: MySQL + 백엔드 API
#   1) backend/.env.example 을 backend/.env 로 복사하고 키 입력
#   2) docker compose up -d --build
#   3) docker compose exec api npm run db:init      (최초 1회: 테이블·기본데이터·대사관)
#   4) http://localhost:3000/api/health  →  {"status":"ok","db":"ok"}
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: resq
      MYSQL_USER: resq
      MYSQL_PASSWORD: resqpass
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    # DB 포트는 PC에 열지 않습니다(api 컨테이너는 내부망 db:3306 으로 접속).
    # PC에 설치된 MySQL(3306)과 충돌하지 않게 하기 위함입니다.
    # Workbench 등으로 직접 보고 싶으면 아래 두 줄 주석을 풀고 localhost:3307 로 접속하세요.
    # ports:
    #   - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: resq
      DB_PASSWORD: resqpass
      DB_NAME: resq
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
